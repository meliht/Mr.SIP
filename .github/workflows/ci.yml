name: CI

on:
  push:
    branches: ["main", "master", "mrsip-dev"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: tests/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r tests/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/ tests/ mr.sip.py

      - name: Test (pytest)
        run: pytest -v

      - name: Smoke test (--help)
        run: python3 mr.sip.py --help
